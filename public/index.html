<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Slurm 实验进度面板：查看任务、执行器、训练进度与日志。">
    <title>实验进度</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/detail.css">
  </head>
  <body>
    <a class="skip-link" href="#main">跳转到任务面板</a>
    <header class="page-header">
      <div class="brand"><span id="cluster">SLURM</span><span class="header-divider" aria-hidden="true"></span><h1 id="title">实验进度</h1><span id="demo-badge" hidden>示例数据</span></div>
      <div class="header-actions">
        <span id="connection" class="connection connecting" role="status"><span class="status-dot"></span><span id="connection-label">正在连接</span></span>
        <a id="slurm-link" href="#" hidden>Slurm-web ↗</a>
        <button id="refresh" class="icon-button" type="button" aria-label="立即刷新" title="立即刷新"></button>
        <label class="checkbox-label"><input id="auto" type="checkbox" checked><span id="auto-label">自动刷新 5s</span></label>
      </div>
    </header>
    <main id="main">
      <div id="error" role="alert" hidden></div>
      <div class="summary-row">
        <section id="metrics" class="metrics" aria-label="任务状态汇总"></section>
        <select id="range" aria-label="历史范围"><option value="all">全部历史</option><option value="24h">最近 24 小时</option><option value="7d">最近 7 天</option><option value="30d">最近 30 天</option></select>
      </div>
      <section class="workers card" aria-labelledby="workers-title">
        <div class="workers-heading">
          <h2 id="workers-title"><span id="workers-icon" aria-hidden="true"></span>GPU 执行器</h2>
          <span id="workers-summary" class="muted">正在读取记录…</span>
          <button id="workers-toggle" class="icon-button" type="button" aria-label="收起 GPU 执行器" aria-expanded="true" aria-controls="workers"></button>
        </div>
        <div id="workers"></div>
      </section>
      <div class="content">
        <section class="jobs card" aria-labelledby="jobs-title">
          <div class="jobs-heading"><h2 id="jobs-title">任务列表 <span id="job-count"></span></h2></div>
          <div class="list-toolbar">
            <div id="list-tabs" class="list-tabs" role="tablist" aria-label="任务状态"><button type="button" role="tab" data-state="active" aria-selected="false">运行中 <span id="active-count">0</span></button><button type="button" role="tab" data-state="all" aria-selected="true">全部</button><button type="button" role="tab" data-state="failed" aria-selected="false">失败</button></div>
            <label class="search-field"><span id="search-icon" aria-hidden="true"></span><input id="search" type="search" placeholder="搜索实验标题或任务 ID" aria-label="搜索实验标题或任务 ID"></label>
            <select id="sort" aria-label="排序方式"><option value="active">运行优先</option><option value="newest">最新提交</option><option value="oldest">最早提交</option></select>
          </div>
          <div id="filter-summary" class="filter-summary" hidden></div>
          <div id="stale-notice" class="stale-notice" hidden><span id="stale-icon" aria-hidden="true"></span><span id="stale-text"></span><button id="stale-filter" class="text-button" type="button">查看</button></div>
          <div id="jobs" aria-busy="true"><p class="empty">正在读取任务…</p></div>
          <div class="pagination"><span id="total-count" class="muted"></span><div><button id="page-prev" class="page-button" type="button" aria-label="上一页" disabled></button><span id="page-info" aria-live="polite">1 / 1</span><button id="page-next" class="page-button" type="button" aria-label="下一页" disabled></button></div></div>
        </section>
        <section id="detail" class="detail card" aria-label="任务详情" aria-busy="false"><p class="empty">选择一个任务，查看进度与日志</p></section>
      </div>
      <footer><span id="time-zone-note"></span><span>进度、吞吐与预计剩余时间由训练脚本报告；预算结束不表示验证和最终评估已经完成。</span></footer>
    </main>
    <noscript><p class="empty">请启用 JavaScript 以查看任务与日志。</p></noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
